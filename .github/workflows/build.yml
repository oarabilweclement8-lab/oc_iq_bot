name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      - name: Create full flutter project
        run: |
          flutter create temp_app --platforms=android --project-name oc_iq_bot
          cp lib/main.dart temp_app/lib/main.dart
          cp pubspec.yaml temp_app/pubspec.yaml
          cd temp_app
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: oc-iq-bot-apk
          path: temp_app/build/app/outputs/flutter-apk/app-release.apk
